[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimal-long-short"
version = "0.2.0"
description = "Semi-analytic liquidation and payoff-moment evaluation for leveraged DeFi long-short positions under bivariate Kou jump-diffusion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Francis Liu", email = "francisliu.hk@gmail.com"},
]
keywords = ["defi", "aave", "liquidation", "jump-diffusion", "kou", "first-passage", "laplace-transform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["requests>=2.31"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.25"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Repository = "https://github.com/francisliu2/Defi_interestRate"

[tool.setuptools.packages.find]
include = ["optimal_long_short*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "slow: long-running numerical checks (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["optimal_long_short"]
omit = ["*/tests/*", "*/job_runners/*"]
